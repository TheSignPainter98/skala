[package]
name = "skala_graph"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
camino = { version = "1.2.2", default-features = false }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
ctrlc = { version = "3.5.2", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
sqlx = { version = "0.8.6", default-features = false, features = ["derive", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1.51.1", default-features = false, features = ["macros", "rt", "time"] }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }
