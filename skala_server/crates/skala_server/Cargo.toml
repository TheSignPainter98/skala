[package]
name = "skala_server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
arboard = { version = "3.6.1", default-features = false }
async-openai = { version = "0.34.0", default-features = false, features = ["chat-completion", "completions"] }
axum = { version = "0.8.8", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tracing"] }
futures-util = { version = "0.3.32", default-features = false }
indoc = { version = "2.0.7", default-features = false }
log = { version = "0.4.29", default-features = false }
notify-rust = { version = "4.16.1", default-features = false, features = ["z"] }
quicktype = { path = "../quicktype", default-features = false }
schemars = { version = "1.2.1", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["derive", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
time = { version = "0.3.47", default-features = false, features = ["std"] }
tokio = { version = "1.52.1", default-features = false, features = ["io-std", "io-util", "macros", "process", "rt"] }

[dev-dependencies]
googletest = { version = "0.14.2", default-features = false }
insta = { version = "1.47.2", default-features = false, features = ["json"] }
