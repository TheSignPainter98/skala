[package]
name = "skala_server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
async-openai = { version = "0.34.0", features = ["chat-completion", "completions"] }
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3.32"
indoc = "2.0.7"
log = "0.4.29"
notify-rust = "4.16.1"
quicktype = { path = "../quicktype" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.1", features = ["io-std", "io-util"] }

[dev-dependencies]
googletest = "0.14.2"
insta = { version = "1.47.2", features = ["json"] }
