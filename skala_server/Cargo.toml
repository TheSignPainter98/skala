[package]
name = "skala_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-openai = { version = "0.34.0", features = ["chat-completion", "completions"] }
axum = { version = "0.8.8", features = ["json"] }
camino = "1.2.2"
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.4.0"
log = "0.4.29"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.51.1", features = ["rt"] }
toml = "1.1.2"

[dev-dependencies]
axum-test = "20.0.0"
googletest = "0.14.2"
insta = { version = "1.47.2", features = ["json"] }
