[package]
name = "skala"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/*"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["json"] }
camino = "1.2.2"
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.4.0"
log = "0.4.29"
skala_server = { path = "crates/skala_server" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.51.1", features = ["rt"] }
toml = "1.1.2"

[dev-dependencies]
axum-test = "20.0.0"
serde_json = "1.0.149"
